name: Kanban CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    name: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install E2E dependencies
        run: npm ci --prefix e2e

      - name: Validate E2E Docker Compose configuration
        run: docker compose -f .github/e2e/docker-compose.yml config

  build:
    name: build
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend assets
        run: bash script/ci/frontend-static.sh build

  lint:
    name: lint
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: bash script/ci/frontend-static.sh lint

  typecheck:
    name: typecheck
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck frontend
        run: bash script/ci/frontend-static.sh typecheck

  test:
    name: test
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend unit tests
        run: bash script/ci/frontend-static.sh test

  ruby-test-redmine-70:
    name: Redmine 7.0 Ruby unit and API tests
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDMINE_IMAGE: redmine:7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Redmine test stack
        run: docker compose -f .github/e2e/docker-compose.yml up -d --wait --wait-timeout 600

      - name: Install Redmine test dependencies
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            sh -lc 'apt-get update && apt-get install -y --no-install-recommends build-essential && bundle config set --local without development && bundle install'

      - name: Configure Redmine database.yml for production
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine sh -lc \
            "printf '%s\n' \
            'production:' \
            '  adapter: mysql2' \
            '  database: redmine' \
            '  host: db' \
            '  username: redmine' \
            '  password: password' \
            '  encoding: utf8mb4' \
            'test:' \
            '  adapter: mysql2' \
            '  database: redmine' \
            '  host: db' \
            '  username: redmine' \
            '  password: password' \
            '  encoding: utf8mb4' \
            > /usr/src/redmine/config/database.yml"

      - name: Migrate Redmine and plugin
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env RAILS_ENV=production bundle exec rake db:migrate redmine:plugins:migrate

      - name: Load default data
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env REDMINE_LANG=en RAILS_ENV=production bundle exec rake redmine:load_default_data

      - name: Prepare test database
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env RAILS_ENV=test bundle exec rake db:migrate redmine:plugins:migrate

      - name: Run Ruby unit and API tests
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env RAILS_ENV=test bash \
            /usr/src/redmine/plugins/redmine_kanban/script/ci/ruby-full.sh

      - name: Run snapshot resource gates
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env RAILS_ENV=test bash \
            /usr/src/redmine/plugins/redmine_kanban/script/ci/snapshot-contract.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f .github/e2e/docker-compose.yml logs --no-color

      - name: Stop Redmine test stack
        if: always()
        run: docker compose -f .github/e2e/docker-compose.yml down -v

  ruby-test-postgresql:
    name: PostgreSQL membership integration
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REDMINE_IMAGE: redmine:7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostgreSQL Redmine test stack
        run: docker compose -f .github/e2e/docker-compose.yml -f .github/e2e/docker-compose.postgres.yml up -d --wait --wait-timeout 600

      - name: Install Redmine PostgreSQL test dependencies
        run: |
          docker compose -f .github/e2e/docker-compose.yml -f .github/e2e/docker-compose.postgres.yml exec -T redmine \
            sh -lc 'apt-get update && apt-get install -y --no-install-recommends build-essential libpq-dev && bundle config set --local without development && bundle install'

      - name: Configure PostgreSQL database.yml
        run: |
          docker compose -f .github/e2e/docker-compose.yml -f .github/e2e/docker-compose.postgres.yml exec -T redmine sh -lc \
            "printf '%s\n' \
            'production:' \
            '  adapter: postgresql' \
            '  database: redmine' \
            '  host: db' \
            '  username: redmine' \
            '  password: password' \
            'test:' \
            '  adapter: postgresql' \
            '  database: redmine' \
            '  host: db' \
            '  username: redmine' \
            '  password: password' \
            > /usr/src/redmine/config/database.yml"

      - name: Migrate PostgreSQL Redmine and plugin
        run: |
          docker compose -f .github/e2e/docker-compose.yml -f .github/e2e/docker-compose.postgres.yml exec -T redmine \
            env RAILS_ENV=production bundle exec rake db:migrate redmine:plugins:migrate
          docker compose -f .github/e2e/docker-compose.yml -f .github/e2e/docker-compose.postgres.yml exec -T redmine \
            env RAILS_ENV=test bundle exec rake db:migrate redmine:plugins:migrate

      - name: Run PostgreSQL unit suite without API selector
        run: |
          docker compose -f .github/e2e/docker-compose.yml -f .github/e2e/docker-compose.postgres.yml exec -T redmine \
            env RAILS_ENV=test bash \
            /usr/src/redmine/plugins/redmine_kanban/script/ci/postgres-unit.sh

      - name: Run PostgreSQL focused API suite with Rails include selector
        run: |
          docker compose -f .github/e2e/docker-compose.yml -f .github/e2e/docker-compose.postgres.yml exec -T redmine \
            env RAILS_ENV=test bash \
            /usr/src/redmine/plugins/redmine_kanban/script/ci/postgres-api.sh

      - name: Show PostgreSQL container logs on failure
        if: failure()
        run: docker compose -f .github/e2e/docker-compose.yml -f .github/e2e/docker-compose.postgres.yml logs --no-color

      - name: Stop PostgreSQL test stack
        if: always()
        run: docker compose -f .github/e2e/docker-compose.yml -f .github/e2e/docker-compose.postgres.yml down -v

  e2e-full:
    name: Redmine ${{ matrix.redmine_version }} Full E2E
    needs:
      - build
      - lint
      - typecheck
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        redmine_version: ['7.0', '6.1']
    env:
      REDMINE_IMAGE: redmine:${{ matrix.redmine_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend assets
        run: bash script/ci/frontend-static.sh build

      - name: Install E2E dependencies
        run: npm ci --prefix e2e

      - name: Install Playwright browser
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Start Redmine stack and wait for health
        run: |
          docker compose -f .github/e2e/docker-compose.yml up -d --wait --wait-timeout 600
          docker compose -f .github/e2e/docker-compose.yml ps

      - name: Configure Redmine database.yml for production
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine sh -lc \
            "printf '%s\n' \
            'production:' \
            '  adapter: mysql2' \
            '  database: redmine' \
            '  host: db' \
            '  username: redmine' \
            '  password: password' \
            '  encoding: utf8mb4' \
            > /usr/src/redmine/config/database.yml"

      - name: Migrate Redmine and plugin
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env RAILS_ENV=production bundle exec rake db:migrate redmine:plugins:migrate

      - name: Load default data
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env REDMINE_LANG=en RAILS_ENV=production bundle exec rake redmine:load_default_data

      - name: Seed project/module for E2E
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T --user redmine \
            redmine \
            bundle exec rails runner -e production plugins/redmine_kanban/e2e/setup_redmine.rb

      - name: Run Playwright E2E
        env:
          REDMINE_BASE_URL: http://127.0.0.1:3002
          CI: true
        run: bash script/ci/e2e-full.sh --grep-invert 'native iframe|native create|actual DB high-fan-out'

      - name: Run native mutation lifecycle E2E
        env:
          REDMINE_BASE_URL: http://127.0.0.1:3002
          CI: true
        run: bash script/ci/native-mutation-e2e.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-redmine-${{ matrix.redmine_version }}
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f .github/e2e/docker-compose.yml logs --no-color

      - name: Stop Redmine stack
        if: always()
        run: docker compose -f .github/e2e/docker-compose.yml down -v

  e2e-large-data:
    name: Redmine 7.0 Large snapshot resource gate
    needs:
      - build
      - lint
      - typecheck
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REDMINE_IMAGE: redmine:7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install and build frontend
        run: |
          npm ci --prefix frontend
          bash script/ci/frontend-static.sh build

      - name: Install E2E dependencies and browser
        run: |
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium

      - name: Start Redmine stack and wait for health
        run: docker compose -f .github/e2e/docker-compose.yml up -d --wait --wait-timeout 600

      - name: Configure Redmine database.yml for production
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine sh -lc \
            "printf '%s\n' \
            'production:' \
            '  adapter: mysql2' \
            '  database: redmine' \
            '  host: db' \
            '  username: redmine' \
            '  password: password' \
            '  encoding: utf8mb4' \
            > /usr/src/redmine/config/database.yml"

      - name: Migrate Redmine and plugin
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env RAILS_ENV=production bundle exec rake db:migrate redmine:plugins:migrate

      - name: Load default data
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env REDMINE_LANG=en RAILS_ENV=production bundle exec rake redmine:load_default_data

      - name: Seed 1,505-child actual DB fixture
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T --user redmine redmine \
            env REDMINE_KANBAN_E2E_TREE_FIXTURE=1 \
            bundle exec rails runner -e production plugins/redmine_kanban/e2e/setup_redmine.rb

      - name: Run actual DB large-data gate
        env:
          REDMINE_BASE_URL: http://127.0.0.1:3002
          CI: true
        run: bash script/ci/large-data-e2e.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f .github/e2e/docker-compose.yml logs --no-color

      - name: Stop Redmine stack
        if: always()
        run: docker compose -f .github/e2e/docker-compose.yml down -v

  e2e-redmine-60-compat:
    name: Redmine 6.0 Compatibility Smoke
    needs:
      - build
      - lint
      - typecheck
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REDMINE_IMAGE: redmine:6.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend assets
        run: bash script/ci/frontend-static.sh build

      - name: Install E2E dependencies
        run: npm ci --prefix e2e

      - name: Install Playwright browser
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Start Redmine stack and wait for health
        run: |
          docker compose -f .github/e2e/docker-compose.yml up -d --wait --wait-timeout 600
          docker compose -f .github/e2e/docker-compose.yml ps

      - name: Configure Redmine database.yml for production
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine sh -lc \
            "printf '%s\n' \
            'production:' \
            '  adapter: mysql2' \
            '  database: redmine' \
            '  host: db' \
            '  username: redmine' \
            '  password: password' \
            '  encoding: utf8mb4' \
            > /usr/src/redmine/config/database.yml"

      - name: Migrate Redmine and plugin
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env RAILS_ENV=production bundle exec rake db:migrate redmine:plugins:migrate

      - name: Load default data
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            env REDMINE_LANG=en RAILS_ENV=production bundle exec rake redmine:load_default_data

      - name: Seed project/module for E2E
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T --user redmine redmine \
            bundle exec rails runner -e production plugins/redmine_kanban/e2e/setup_redmine.rb

      - name: Run Playwright compatibility smoke
        env:
          REDMINE_BASE_URL: http://127.0.0.1:3002
          CI: true
        run: bash script/ci/compatibility-smoke.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-redmine-60
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f .github/e2e/docker-compose.yml logs --no-color

      - name: Stop Redmine stack
        if: always()
        run: docker compose -f .github/e2e/docker-compose.yml down -v
